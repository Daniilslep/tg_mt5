; ============================================================
;  НАСТРОЙКИ SignalKit — скопируется в НАСТРОЙКИ.ini при первом запуске
;  Заполните своими данными. Строки с ; — комментарии.
; ============================================================

[telegram]
; Имя канала БЕЗ https://t.me/  (можно с @ или без)
channel=your_channel

; Режим загрузки истории:
;   telethon = полная история (нужны api_id, api_hash, phone)
;   web      = только свежие посты с публичной ленты (без логина)
fetch_mode=telethon

; Взять на https://my.telegram.org → API development tools
; Нужны ТОЛЬКО для fetch_mode=telethon (робот №1 за длинный период)
api_id=
api_hash=
phone=

[period]
; Сколько дней назад смотреть (для робота №1)
days_back=30

[parse]
; Готовый шаблон: tradingplus  |  amarkets  |  custom
preset=tradingplus

; labels = подписи в тексте («Цена открытия: …»)
; compact = одна строка (#EURUSD H1 Buy 1.10 SL … TP …)
format=labels

; Пост ОБЯЗАН содержать эти слова (через | ). Иначе пропускаем.
; При manage.enabled=yes посты с #символом всё равно попадают в сопровождение.
must_contain=Стоп лосс

; Если есть эти слова — пост НЕ берём (при manage.enabled=no).
; При включённом сопровождении лучше оставить пустым.
skip_if_contains=

; Символ из #EURUSD
symbol_from_hashtag=yes

; Подписи полей в сообщениях канала (как у автора)
label_side=Тип сделки
label_entry=Цена открытия
label_sl=Стоп лосс
label_tp=Тейк профит

; Слова для направления / типа ордера (через |)
buy_words=покуп|лонг|buy|long
sell_words=продаж|шорт|sell|short
limit_words=лимит|limit

; Если TP написан как «Открытый» — считаем цель = RR × риск до стопа
tp_open_words=открыт
open_tp_rr=2.0

; Для format=compact:
compact_side_buy=Buy
compact_side_sell=Sell
compact_sl_word=SL
compact_tp_word=TP

[manage]
; Сопровождение сделок цепочками сообщений
; yes = учитывать закрытия / BE / смену уровней / отмену лимита
enabled=yes
link_max_hours=720
link_max_id_gap=300
informal_as_manage=yes
words_cancel_pending=лимитный ордер удаляем|ордер удаляем|лимитку удаляем|удаляем лимит|лимитный ордер снимаем|не ушел в работу|не ушёл в работу|сценарий уже не актуален|сценарий не актуален|уже не актуален|ордер снимаем|снимаем ордер|отменяем ордер|order not filled|idea no longer valid|setup invalid
words_reverse=перезаходим|разворот|в противополож|закрываем продажу и|закрываем покупку и
words_breakeven=безубыток|безубытк|стоп в бе|переносим стоп|стоп лосс переносим|на точку входа|точку входа|точки входа|в безубыток|breakeven|break even
words_close=фиксируем прибыль|фиксируем сделку|фиксируем обе|фиксируем полностью|фиксируем всю|фиксируем результат|закрываем полностью|закрываем сделку|закрываем обе|выходим из сделки|закрыли сделку|закрыли полностью|close trade|close position|close fully|book profit|take profit fully
words_modify_sl=стоп лосс перемещаем|стоп лосс меняем|стоп лосс по открытой|меняем стоп|выставляем стоп|стоп лосс обратно|выставляем стоп лосс
words_modify_tp=тейк профит выставляем|тейк профит ставим|тейк профит меняем|тейк профит переносим|тейк профит на|выставляем тейк|меняем тейк|take profit to|tp to|set tp
words_clear_expiry=убираем дату истечения|ордер до отмены|без даты истечения|good till cancel|gtc|remove expiry|no expiry|until cancelled|until canceled
words_add=еще один ордер|ещё один ордер|усредн|добираем|открываем еще
words_to_market=по рынку|по рыночн|рыночной цене|открываемся по рынку|заходим по рынку|открываем по рынку
words_keep_pending=лимитку не удаляем|лимит не удаляем|ордер не удаляем
words_inherit_levels=не меняем|без изменений|параметры без|остальные параметры|keep sl|sl unchanged|levels unchanged|same stop
words_modify_levels=меняем цену|цену открытия на|сменили цен|переставляем лимит|переставляем ордер

[trade]
fixed_lot=0.01
dry_run=yes
ignore_history=yes
poll_seconds=10

[backtest]
; Таймфрейм истории MT5: M1 | M5 | M15 | H1 | …
; Для длинного M1: в MT5 Сервис → Настройки → Графики → макс. баров = Unlimited
timeframe=M1
