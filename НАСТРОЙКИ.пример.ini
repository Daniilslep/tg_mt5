; ============================================================
;  НАСТРОЙКИ SignalKit — скопируйте этот файл как НАСТРОЙКИ.ini
;  и заполните свои данные. Строки с ; — комментарии.
;
;  Windows:  copy "НАСТРОЙКИ.пример.ini" "НАСТРОЙКИ.ini"
;  Или просто запустите START.bat — файл создастся сам.
; ============================================================

[telegram]
; Имя канала БЕЗ https://t.me/  (с @ или без)
channel=

; telethon = полная история (нужны api_id, api_hash, phone)
; web      = только свежие посты публичной ленты (без логина)
fetch_mode=telethon

; https://my.telegram.org → API development tools
; Нужны только для fetch_mode=telethon
api_id=
api_hash=
; Международный формат: +79001234567
phone=

[period]
; Сколько дней истории скачивать
days_back=30

[parse]
; Готовый шаблон: tradingplus | amarkets | custom
preset=custom

; labels = подписи в тексте («Цена открытия: …»)
; compact = одна строка (#EURUSD H1 Buy 1.10 SL … TP …)
format=labels

; Пост должен содержать эти слова (через |). Пусто = не фильтровать.
must_contain=

; При manage.enabled=yes эти слова НЕ отсекают пост (нужны для сопровождения)
skip_if_contains=

symbol_from_hashtag=yes

; Подписи полей — как у автора вашего канала
label_side=Тип сделки
label_entry=Цена открытия
label_sl=Стоп лосс
label_tp=Тейк профит

buy_words=покуп|лонг|buy|long
sell_words=продаж|шорт|sell|short
limit_words=лимит|limit

tp_open_words=открыт
open_tp_rr=2.0

compact_side_buy=Buy
compact_side_sell=Sell
compact_sl_word=SL
compact_tp_word=TP

[manage]
; Сопровождение: корректировки стопа, отмена лимита, разворот, смена цены
enabled=yes
link_max_hours=720
link_max_id_gap=300
informal_as_manage=yes
words_cancel_pending=лимитный ордер удаляем|ордер удаляем|лимитку удаляем|удаляем лимит
words_reverse=перезаходим|разворот|в противополож|закрываем продажу и|закрываем покупку и
words_breakeven=безубыток|переносим стоп|на точку входа|точку входа|breakeven|break even
words_close=закрываем полностью|закрываем сделку|выходим из сделки|фиксируем всю
words_modify_sl=стоп лосс перемещаем|стоп лосс меняем|меняем стоп|выставляем стоп|стоп лосс обратно
words_add=усредн|добираем|еще один ордер|ещё один ордер
words_to_market=по рынку|по рыночн|открываемся по рынку|заходим по рынку|открываем по рынку
words_keep_pending=лимитку не удаляем|лимит не удаляем
words_inherit_levels=не меняем|без изменений|параметры без|остальные параметры
words_modify_levels=меняем цену|цену открытия на|сменили цен|переставляем лимит

[trade]
fixed_lot=0.01
dry_run=yes
ignore_history=yes
poll_seconds=10

[backtest]
; M1 | M5 | M15 | H1 …
timeframe=M1
