[telegram]
channel=AMarkets_Trading_Ideas

[parse]
format=compact
must_contain=SL|TP
skip_if_contains=
symbol_from_hashtag=yes
label_side=
label_entry=
label_sl=
label_tp=
buy_words=buy
sell_words=sell
limit_words=
tp_open_words=
open_tp_rr=2.0
compact_side_buy=Buy
compact_side_sell=Sell
compact_sl_word=SL
compact_tp_word=TP

[manage]
enabled=no
